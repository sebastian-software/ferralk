[package]
name = "ferralk-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.96"

[package.metadata]
cargo-fuzz = true

[dependencies]
corpus = { path = "../tools/corpus" }
fast-glob = "=1.1.0"
ferralk-glob = { path = "../crates/ferralk-glob" }
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
ferralk = { path = "../crates/ferralk", features = ["native-macos"] }

[target.'cfg(target_os = "linux")'.dependencies]
ferralk = { path = "../crates/ferralk", features = ["native-linux"] }

[[bin]]
name = "ignore_rule_parser"
path = "fuzz_targets/ignore_rule_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pattern_parser"
path = "fuzz_targets/pattern_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pattern_matcher"
path = "fuzz_targets/pattern_matcher.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ferralk_vs_fast_glob"
path = "fuzz_targets/ferralk_vs_fast_glob.rs"
test = false
doc = false
bench = false

[[bin]]
name = "macos_dirent_parser"
path = "fuzz_targets/macos_dirent_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "macos_bulk_record_parser"
path = "fuzz_targets/macos_bulk_record_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "generate_macos_native_seeds"
path = "seed_corpora/generate_macos_native_seeds.rs"
test = false
doc = false
bench = false

[[bin]]
name = "linux_dirent_parser"
path = "fuzz_targets/linux_dirent_parser.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
