[package]
name = "ferralk-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.93"

[package.metadata]
cargo-fuzz = true

[dependencies]
ferralk-glob = { path = "../crates/ferralk-glob" }
libfuzzer-sys = "0.4"

[[bin]]
name = "pattern_parser"
path = "fuzz_targets/pattern_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pattern_matcher"
path = "fuzz_targets/pattern_matcher.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
