[package]
name = "bench"
description = "Unpublished benchmark harness for ferralk development."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
native-linux = ["ferralk/native-linux"]
native-macos = ["ferralk/native-macos"]
zlob-oracle = ["dep:zlob"]

[dependencies]
zlob = { version = "=1.6.5", optional = true }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
ferralk = { path = "../../crates/ferralk" }
ferralk-glob = { path = "../../crates/ferralk-glob" }
fast-glob = "=1.1.1"
globwalk = "=0.9.1"
globset = "=0.4.20"
ignore = "=0.4.33"
jwalk = "=0.9.0"
walkdir = "=2.5.0"
wax = "=0.7.0"

[[bench]]
name = "matcher"
harness = false

[[bench]]
name = "walker"
harness = false

[[bench]]
name = "walker_palamedes"
harness = false

[[bench]]
name = "walker_zlob"
harness = false
required-features = ["zlob-oracle"]

[[bench]]
name = "walker_zlob_ablation"
harness = false
required-features = ["zlob-oracle"]

[[bench]]
name = "matcher_zlob"
harness = false
required-features = ["zlob-oracle"]

[lints]
workspace = true
