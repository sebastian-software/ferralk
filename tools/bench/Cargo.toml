[package]
name = "bench"
description = "Unpublished benchmark harness for ferralk development."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
native-macos = ["ferralk/native-macos"]
zlob-oracle = ["dep:zlob"]

[dependencies]
zlob = { version = "=1.6.3", optional = true }

[dev-dependencies]
codspeed-criterion-compat = "5.0.1"
ferralk = { path = "../../crates/ferralk" }
ferralk-glob = { path = "../../crates/ferralk-glob" }
fast-glob = "=1.1.0"
globset = "=0.4.20"
ignore = "0.4"

[[bench]]
name = "matcher"
harness = false

[[bench]]
name = "walker"
harness = false

[[bench]]
name = "walker_zlob"
harness = false
required-features = ["zlob-oracle"]

[[bench]]
name = "matcher_zlob"
harness = false
required-features = ["zlob-oracle"]

[lints]
workspace = true
