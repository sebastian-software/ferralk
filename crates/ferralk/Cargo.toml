[package]
name = "ferralk"
description = "Portable filesystem walking for ferralk."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# The Git-verified ignore corpus replay needs the unpublished `corpus`
# package, a path-only dev-dependency that Cargo strips when packaging. Keep
# that test out of the tarball so `cargo test` builds from the published crate.
exclude = ["tests/git_ignore_corpus.rs"]

[features]
native-linux = []
native-macos = []

[dependencies]
crossbeam-deque = "=0.8.7"
ferralk-glob = { path = "../ferralk-glob", version = "0.11.0" }
memchr = "=2.8.3"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = "=0.1.25"

[dev-dependencies]
allocation-counter = "=0.8.1"
corpus = { path = "../../tools/corpus" }
# The engine ADR-0014 replaced, kept for the test that compares the two rule
# matchers over generated rules and paths.
ignore = "=0.4.33"
loom = "=0.7.2"
serde_json.workspace = true

[lints]
workspace = true
