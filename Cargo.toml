[workspace]
members = [
    "crates/ferralk-glob",
    "crates/ferralk",
    "tools/corpus",
    "tools/harness",
    "tools/oracle",
    "tools/bench",
    "tools/doc-tests",
]
default-members = ["crates/ferralk-glob", "crates/ferralk"]
resolver = "3"

[workspace.package]
version = "0.9.4"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/sebastian-software/ferralk"
homepage = "https://github.com/sebastian-software/ferralk"
keywords = ["glob", "filesystem", "walk", "ignore"]
categories = ["filesystem", "development-tools"]

[workspace.lints.rust]
unsafe_code = "deny"
# `--cfg loom` swaps the scheduler protocol onto loom's primitives for the
# models in crates/ferralk/src/scheduler.rs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
