name: Homepage

on:
  pull_request:
    paths:
      - "homepage/**"
      - "docs/**"
      - "**/*.md"
      - "README.md.src"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "corpus/**"
      - "tools/bench/benches/matcher.rs"
      - ".release-please-manifest.json"
      - ".github/workflows/homepage.yml"
  push:
    branches: [main]
    paths:
      - "homepage/**"
      - "docs/**"
      - "**/*.md"
      - "README.md.src"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "corpus/**"
      - "tools/bench/benches/matcher.rs"
      - ".release-please-manifest.json"
      - ".github/workflows/homepage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: Enable the pinned pnpm version
        working-directory: homepage
        run: corepack enable && corepack install
      - name: Install website dependencies
        working-directory: homepage
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: homepage
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify native examples, source, build and browser behavior
        working-directory: homepage
        run: pnpm verify
      - name: Upload the production site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: homepage/build/client

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
