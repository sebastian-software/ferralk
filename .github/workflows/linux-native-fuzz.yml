name: Linux native fuzz

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Maximum fuzz duration in seconds
        required: true
        default: "300"

permissions:
  contents: read

env:
  # Keep PR fuzzing bounded while retaining a longer manual validation run.
  MAX_TOTAL_TIME: ${{ inputs.max_total_time || '60' }}

jobs:
  fuzz:
    name: Linux native fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The nightly is pinned once, in .github/nightly-toolchain.
      - name: Read the pinned nightly
        run: |
          toolchain=$(cat .github/nightly-toolchain)
          echo "NIGHTLY_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
      # The seeded `rust-toolchain.toml` selects stable and outranks the
      # rustup default this action sets; a directory override outranks the
      # file. Without this line the job would silently run on stable.
      - run: rustup override set "$NIGHTLY_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-fuzz
      - name: Restore linux_dirent_parser corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/linux_dirent_parser
          key: native-fuzz-${{ runner.os }}-linux_dirent_parser-${{ github.run_id }}
          restore-keys: |
            native-fuzz-${{ runner.os }}-linux_dirent_parser-
      # cargo-fuzz defaults to the target it was itself built for, and the
      # prebuilt binary is musl, where the sanitizer cannot link against a
      # static libc. Name the host target the sanitizer job already uses.
      - name: Run linux_dirent_parser
        shell: bash
        run: |
          if [[ ! "$MAX_TOTAL_TIME" =~ ^[1-9][0-9]{0,4}$ ]] || (( MAX_TOTAL_TIME > 14400 )); then
            echo "::error::max_total_time must be an integer between 1 and 14400, got: $MAX_TOTAL_TIME" >&2
            exit 1
          fi
          cargo fuzz run --target x86_64-unknown-linux-gnu linux_dirent_parser \
            -- -max_total_time="$MAX_TOTAL_TIME"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-native-fuzz-artifacts-linux_dirent_parser
          path: fuzz/artifacts/
          if-no-files-found: ignore

  address-sanitizer:
    name: Linux AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The nightly is pinned once, in .github/nightly-toolchain.
      - name: Read the pinned nightly
        run: |
          toolchain=$(cat .github/nightly-toolchain)
          echo "NIGHTLY_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
      # The seeded `rust-toolchain.toml` selects stable and outranks the
      # rustup default this action sets; a directory override outranks the
      # file. Without this line the job would silently run on stable.
      - run: rustup override set "$NIGHTLY_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run AddressSanitizer tests
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Zsanitizer=address
        run: >-
          cargo test --locked --target x86_64-unknown-linux-gnu -p ferralk --features native-linux --lib

  miri-parser:
    name: Linux Miri parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The nightly is pinned once, in .github/nightly-toolchain.
      - name: Read the pinned nightly
        run: |
          toolchain=$(cat .github/nightly-toolchain)
          echo "NIGHTLY_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo "+$NIGHTLY_TOOLCHAIN" miri setup
      # The raw-syscall reader requires a real Linux kernel. These focused tests
      # exercise the bounds-checked parser without crossing that FFI boundary.
      # Running each filter individually and checking for `1 passed; 0 failed;
      # 0 ignored` guarantees a renamed or misspelled test can never turn this
      # job into a silent zero-test pass.
      - name: Run Miri on pure-Rust parser unit tests
        shell: bash
        run: |
          set -euo pipefail
          miri_tests=(
            linux_native::tests::parser_skips_dot_entries_and_rejects_malformed_records
            linux_native::tests::parser_rejects_separators_and_keeps_long_names
          )
          if [ "${#miri_tests[@]}" -eq 0 ]; then
            echo "::error::miri_tests must not be empty" >&2
            exit 1
          fi
          for test_name in "${miri_tests[@]}"; do
            log="$RUNNER_TEMP/miri-output.log"
            cargo "+$NIGHTLY_TOOLCHAIN" miri test -p ferralk \
              --features native-linux --lib --locked -- --exact "$test_name" | tee "$log"
            if ! grep -Fq "test ${test_name} ... ok" "$log" || \
               ! grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored' "$log"; then
              echo "::error::Miri did not run exactly one passing test for $test_name" >&2
              exit 1
            fi
          done
