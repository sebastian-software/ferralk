name: Linux native fuzz

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Maximum fuzz duration in seconds
        required: true
        default: "300"

permissions:
  contents: read

env:
  # Keep PR fuzzing bounded while retaining a longer manual validation run.
  MAX_TOTAL_TIME: ${{ inputs.max_total_time || '60' }}

jobs:
  fuzz:
    name: Linux native fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: nightly-2026-08-04
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-fuzz
      - name: Restore linux_dirent_parser corpus
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: fuzz/corpus/linux_dirent_parser
          key: native-fuzz-${{ runner.os }}-linux_dirent_parser-${{ github.run_id }}
          restore-keys: |
            native-fuzz-${{ runner.os }}-linux_dirent_parser-
      # cargo-fuzz defaults to the target it was itself built for, and the
      # prebuilt binary is musl, where the sanitizer cannot link against a
      # static libc. Name the host target the sanitizer job already uses.
      - run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu linux_dirent_parser
          -- -max_total_time=$MAX_TOTAL_TIME

  address-sanitizer:
    name: Linux AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: nightly-2026-08-04
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run AddressSanitizer tests
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Zsanitizer=address
        run: >-
          cargo test --target x86_64-unknown-linux-gnu -p ferralk --features native-linux --lib

  miri-parser:
    name: Linux Miri parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: nightly-2026-08-04
          components: miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +nightly-2026-08-04 miri setup
      # The raw-syscall reader requires a real Linux kernel. This focused test
      # exercises the bounds-checked parser without crossing that FFI boundary.
      - run: cargo +nightly-2026-08-04 miri test -p ferralk --features native-linux linux_native::tests::parser_skips_dot_entries_and_rejects_truncated_records
