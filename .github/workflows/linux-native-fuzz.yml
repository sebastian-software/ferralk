name: Linux native fuzz

on:
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Maximum fuzz duration in seconds
        required: true
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run linux_dirent_parser -- -max_total_time=${{ inputs.max_total_time }}

  address-sanitizer:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo test -p ferralk --features native-linux --lib

  miri-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly miri setup
      # The raw-syscall reader requires a real Linux kernel. This focused test
      # exercises the bounds-checked parser without crossing that FFI boundary.
      - run: cargo +nightly miri test -p ferralk --features native-linux linux_native::tests::parser_skips_dot_entries_and_rejects_truncated_records
