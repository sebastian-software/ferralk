name: Linux native fuzz

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Maximum fuzz duration in seconds
        required: true
        default: "300"

permissions:
  contents: read

env:
  # Keep PR fuzzing bounded while retaining a longer manual validation run.
  MAX_TOTAL_TIME: ${{ inputs.max_total_time || '60' }}

jobs:
  fuzz:
    name: Linux native fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-04
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz is a musl binary and defaults to its own target,
      # where the sanitizer cannot link against a static libc. Name the runner's
      # host target, which is what a source-built cargo-fuzz picked by itself.
      - run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu linux_dirent_parser
          -- -max_total_time=$MAX_TOTAL_TIME

  address-sanitizer:
    name: Linux AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-04
      - uses: Swatinem/rust-cache@v2
      - name: Run AddressSanitizer tests
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Zsanitizer=address
        # Loom's generator runtime intentionally retains model state until
        # process exit, which LeakSanitizer reports outside the native code.
        run: >-
          cargo test --target x86_64-unknown-linux-gnu -p ferralk --features native-linux --lib --
          --skip scheduler::loom_models::last_completion_notifies_exactly_once
          --skip scheduler::loom_models::queued_child_keeps_waiting_workers_alive_until_it_is_observed

  miri-parser:
    name: Linux Miri parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-04
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly-2026-08-04 miri setup
      # The raw-syscall reader requires a real Linux kernel. This focused test
      # exercises the bounds-checked parser without crossing that FFI boundary.
      - run: cargo +nightly-2026-08-04 miri test -p ferralk --features native-linux linux_native::tests::parser_skips_dot_entries_and_rejects_truncated_records
