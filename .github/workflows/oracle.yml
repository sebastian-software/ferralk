name: Replay corpus against zlob oracle

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the replay is needed; the corpus is checked in and is never rewritten here.
        required: true
        type: string

permissions:
  contents: read

jobs:
  replay:
    name: zlob 1.6.3 oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Replay corpus and generated common subset against zlob
        shell: bash
        env:
          # zlob 1.6.3's recursive extglob matcher exceeds Rust's default
          # test-thread stack on the checked-in stress corpus.
          RUST_MIN_STACK: 16777216
        run: |
          cargo test -p oracle --test zlob_oracle --test generated_subset \
            -- --ignored --nocapture 2>&1 | tee oracle-replay.log
      - name: Upload the replay log with its skip counts and disagreements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oracle-replay-log
          path: oracle-replay.log
          if-no-files-found: warn
