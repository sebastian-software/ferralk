name: macOS native fuzz

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Maximum fuzz duration in seconds
        required: true
        default: "300"

permissions:
  contents: read

env:
  # Keep PR fuzzing bounded while retaining a longer manual validation run.
  MAX_TOTAL_TIME: ${{ inputs.max_total_time || '60' }}

jobs:
  fuzz:
    name: macOS native fuzz
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: nightly-2026-08-04
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-fuzz
      # cargo-fuzz defaults to the target it was itself built for, and the
      # prebuilt binary is x86_64 while this runner is aarch64. Name the host
      # target the sanitizer job already uses.
      - run: >-
          cargo fuzz run --target aarch64-apple-darwin macos_dirent_parser
          -- -max_total_time=$MAX_TOTAL_TIME

  address-sanitizer:
    name: macOS AddressSanitizer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: nightly-2026-08-04
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run AddressSanitizer tests
        env:
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1
        # Loom's generator runtime intentionally retains model state until
        # process exit, which LeakSanitizer reports outside the native code.
        run: >-
          cargo test --target aarch64-apple-darwin -p ferralk --features native-macos --lib --
          --skip scheduler::loom_models::last_completion_notifies_exactly_once
          --skip scheduler::loom_models::queued_child_keeps_waiting_workers_alive_until_it_is_observed
