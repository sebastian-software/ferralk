name: macOS native fuzz

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Maximum fuzz duration in seconds
        required: true
        default: "300"

permissions:
  contents: read

env:
  # Keep PR fuzzing bounded while retaining a longer manual validation run.
  MAX_TOTAL_TIME: ${{ inputs.max_total_time || '60' }}

jobs:
  fuzz:
    name: macOS native fuzz
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [macos_dirent_parser, macos_bulk_record_parser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: nightly-2026-08-04
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-fuzz
      - name: Restore ${{ matrix.target }} corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: native-fuzz-${{ runner.os }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            native-fuzz-${{ runner.os }}-${{ matrix.target }}-
      # cargo-fuzz defaults to the target it was itself built for, and the
      # prebuilt binary is x86_64 while this runner is aarch64. Name the host
      # target the sanitizer job already uses.
      - run: >-
          cargo fuzz run --target aarch64-apple-darwin ${{ matrix.target }}
          -- -max_total_time=$MAX_TOTAL_TIME

  address-sanitizer:
    name: macOS AddressSanitizer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: nightly-2026-08-04
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run AddressSanitizer tests
        env:
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1
        run: >-
          cargo test --target aarch64-apple-darwin -p ferralk --features native-macos --lib
