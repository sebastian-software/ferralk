name: fuzz

# Manual single-target runs with a custom budget. `glob-fuzz.yml` runs every
# glob target automatically on pull requests and nightly.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Fuzz target
        required: true
        type: choice
        default: pattern_matcher
        options:
          - pattern_parser
          - pattern_matcher
          - ferralk_vs_fast_glob
      max_total_time:
        description: Maximum fuzz duration in seconds
        required: true
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: nightly-2026-08-04
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-fuzz
      # cargo-fuzz defaults to the target it was itself built for, and the
      # prebuilt binary is musl, where the sanitizer cannot link against a
      # static libc. Name this runner's host target instead.
      - run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ inputs.target }}
          -- -max_total_time=${{ inputs.max_total_time }}
