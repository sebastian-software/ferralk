name: fuzz

on:
  workflow_dispatch:
    inputs:
      target:
        description: Fuzz target
        required: true
        type: choice
        default: pattern_matcher
        options:
          - pattern_parser
          - pattern_matcher
      max_total_time:
        description: Maximum fuzz duration in seconds
        required: true
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz is a musl binary and defaults to its own target,
      # where the sanitizer cannot link against a static libc. Name the runner's
      # host target, which is what a source-built cargo-fuzz picked by itself.
      - run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ inputs.target }}
          -- -max_total_time=${{ inputs.max_total_time }}
