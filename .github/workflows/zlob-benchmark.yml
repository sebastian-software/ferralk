name: Ferralk publication benchmark

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this benchmark is being run.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publication:
    name: Full comparison (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b42514dcedbfc374bba581335fe7ef7469655562
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.1
      - name: Set up and capture the measurement environment
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          npm ci --prefix tools/bench/node
          printf 'LIBCLANG_PATH=%s/usr/lib\n' "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain" >> "$GITHUB_ENV"
          mkdir -p benchmark-results
          {
            date -u +%FT%TZ
            git rev-parse HEAD
            git status --porcelain
            sw_vers
            uname -m
            sysctl hw.model hw.ncpu hw.memsize machdep.cpu.brand_string
            uname -a
            df -h "${TMPDIR:-/tmp}"
            diskutil info "${TMPDIR:-/tmp}" || true
            xcodebuild -version
            clang --version
            rustc -vV
            cargo -V
            zig version
            node --version
            npm --version
          } | tee benchmark-results/environment.txt
      - name: Measure the full comparison sequentially
        shell: bash
        run: |
          set -euo pipefail

          measure() {
            local name="$1"
            shift
            rm -rf target/criterion
            cargo bench --locked -p bench "$@" -- \
              --warm-up-time 1 --measurement-time 2 --sample-size 20 \
              --output-format bencher --noplot | tee "benchmark-results/$name.txt"
            grep -q 'ns/iter' "benchmark-results/$name.txt"
          }

          measure matcher --bench matcher
          measure matcher-zlob --bench matcher_zlob --features zlob-oracle
          measure walker-portable --bench walker
          measure walker-native --bench walker --features native-macos
          measure engine-portable --bench walker_palamedes --features zlob-oracle
          measure engine-native --bench walker_palamedes --features native-macos,zlob-oracle
          measure walker-zlob --bench walker_zlob --features zlob-oracle
          measure walker-zlob-ablation --bench walker_zlob_ablation --features native-macos,zlob-oracle
          measure pattern-set --bench pattern_set
          npm run bench --prefix tools/bench/node | tee benchmark-results/node.txt
      - name: Repeat the portable thread sweep
        shell: bash
        run: |
          set -euo pipefail
          for repetition in 1 2 3; do
            rm -rf target/criterion
            cargo bench --locked -p bench --bench walker_palamedes \
              --features zlob-oracle,thread-sweep -- thread_sweep/ \
              --warm-up-time 1 --measurement-time 2 --sample-size 20 \
              --output-format bencher --noplot | tee "benchmark-results/thread-sweep-$repetition.txt"
            grep -q 'ns/iter' "benchmark-results/thread-sweep-$repetition.txt"
          done
      - name: Upload raw results and environment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ferralk-publication-benchmarks
          path: benchmark-results/
          if-no-files-found: error
