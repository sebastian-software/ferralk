name: zlob CodSpeed comparison

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this manual zlob comparison is being run.
        required: true
        type: string

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo bench -p bench --bench walker_zlob --bench matcher_zlob --features zlob-oracle
