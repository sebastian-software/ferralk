name: Ferralk matched performance comparison

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this benchmark is being run.
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: Compare three Ferralk revisions on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-26.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b42514dcedbfc374bba581335fe7ef7469655562
          fetch-depth: 0
          persist-credentials: false
      - name: Record environment and build each revision before any measurements
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          mkdir -p results
          {
            date -u +%FT%TZ
            uname -a
            if [[ "$RUNNER_OS" == macOS ]]; then
              sw_vers
              sysctl hw.model hw.ncpu hw.memsize machdep.cpu.brand_string
            else
              cat /etc/os-release
              lscpu
            fi
            rustc +1.99.1 -vV
          } | tee results/environment.txt

          compile() {
            local label="$1" directory="$2" workload="$3" bench="$4"
            shift 4
            cargo +1.99.1 bench --manifest-path "$directory/Cargo.toml" --locked \
              -p bench --bench "$bench" "$@" --no-run --message-format json |
              python3 -c 'import json, sys
          executables = [event["executable"] for event in map(json.loads, sys.stdin)
                         if event.get("executable") and "bench" in event.get("target", {}).get("kind", [])]
          assert len(executables) == 1, executables
          print(executables[0])' > "$RUNNER_TEMP/$label-$workload.bin"
          }

          for entry in \
            september:261df0d65f6bcf5e12a88462e8529f89c779460d \
            release:8d048bebba60a5e27e8e9bc25922fc1fe439755a \
            main:b42514dcedbfc374bba581335fe7ef7469655562; do
            label="${entry%%:*}"
            revision="${entry#*:}"
            directory="$RUNNER_TEMP/$label"
            git worktree add --detach "$directory" "$revision"
            printf '%s %s\n' "$label" "$(git -C "$directory" rev-parse HEAD)" | tee -a results/revisions.txt
            compile "$label" "$directory" matcher matcher
            compile "$label" "$directory" portable walker_palamedes
            if [[ "$RUNNER_OS" == macOS ]]; then
              compile "$label" "$directory" native walker_palamedes --features native-macos
            fi
          done
      - name: Measure equivalent workloads in rotating revision order
        shell: bash
        run: |
          set -euo pipefail
          measure() {
            local repetition="$1" label="$2" workload="$3" filter="$4" expected="$5"
            local executable
            executable=$(cat "$RUNNER_TEMP/$label-$workload.bin")
            mkdir -p "$RUNNER_TEMP/run-$repetition-$label-$workload"
            (
              cd "$RUNNER_TEMP/run-$repetition-$label-$workload"
              "$executable" --bench "$filter" --warm-up-time 1 --measurement-time 3 \
                --sample-size 20 --output-format bencher --noplot
            ) | tee "results/$repetition-$label-$workload.txt"
            [[ "$(grep -c 'ns/iter' "results/$repetition-$label-$workload.txt")" == "$expected" ]]
          }

          for repetition in 1 2 3; do
            case "$repetition" in
              1) order=(september release main) ;;
              2) order=(release main september) ;;
              3) order=(main september release) ;;
            esac
            for label in "${order[@]}"; do
              measure "$repetition" "$label" matcher '^common/ferralk_compiled/(matching|non_matching)$' 2
            done
            for label in "${order[@]}"; do
              measure "$repetition" "$label" portable '^walker_palamedes/(unscoped|scoped)/ferralk_parallel$' 2
            done
            if [[ "$RUNNER_OS" == macOS ]]; then
              for label in "${order[@]}"; do
                measure "$repetition" "$label" native '^walker_palamedes/(unscoped|scoped)/ferralk_parallel$' 2
              done
            fi
          done
      - name: Upload matched comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matched-comparison-${{ matrix.os }}
          path: results/
          if-no-files-found: error
