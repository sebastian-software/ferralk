name: Publish crates

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Actually publish to crates.io (not just package)
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch

      - name: Validate the workspace
        run: cargo test --locked

      # The corpus is the behavioural contract, so a release cannot ship
      # while it disagrees with the matcher.
      - name: Replay the checked-in corpus
        run: |
          cargo test --locked -p corpus -p harness
          cargo run --locked -p harness -- corpus

      - name: Package ferralk-glob
        run: cargo package --locked --no-verify -p ferralk-glob

      - name: Publish ferralk-glob
        if: ${{ github.event_name == 'release' || inputs.publish }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p ferralk-glob

      - name: Publish ferralk after registry sync
        if: ${{ github.event_name == 'release' || inputs.publish }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for attempt in {1..10}; do
            if cargo publish --locked -p ferralk; then
              exit 0
            fi

            if [ "$attempt" -eq 10 ]; then
              exit 1
            fi

            sleep 15
          done
