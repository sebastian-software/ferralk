name: Walker benchmarks

# The wall-time lane, and since 2026-08-19 the only automated performance
# lane: walker benches touch the filesystem and run on several threads, so
# only elapsed time says anything useful about them. Criterion measures, and
# pull requests compare merge-base and head medians back to back in one job.
# Push and dispatch runs publish one snapshot.
#
# A shared GitHub runner is noisy: read these numbers as indicative, and
# compare runs on the same lane rather than treating a single delta as a
# regression. See docs/benchmark-evidence.md for what this lane does and does
# not establish.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  walltime:
    name: walker walltime (${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One lane per backend that ships, because a backend nothing measures
        # is a backend nothing notices getting slower. The macOS lane was added
        # on 2026-08-20, after the bulk reader spent its whole life unmeasured
        # here and turned out to be losing to the portable one.
        include:
          - lane: portable
            os: ubuntu-latest
            features: ""
          - lane: native-linux
            os: ubuntu-latest
            features: "--features native-linux"
          - lane: native-macos
            os: macos-latest
            features: "--features native-macos"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull-request jobs need both commits in order to derive the true
          # merge base rather than comparing with a stored or moving baseline.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Prepare pull-request revisions
        if: github.event_name == 'pull_request'
        id: revisions
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git worktree add --detach "$RUNNER_TEMP/ferralk-bench-base" "$merge_base"
          git worktree add --detach "$RUNNER_TEMP/ferralk-bench-head" "$HEAD_SHA"
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Build pull-request benchmark binaries
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          build_benchmark() {
            local source=$1
            local destination=$2
            local target=$3
            CARGO_TARGET_DIR="$target" \
              cargo bench --manifest-path "$source/Cargo.toml" \
                -p bench --bench walker ${{ matrix.features }} \
                --locked --no-run --message-format=json |
              python3 -c '
          import json
          import shutil
          import sys

          executable = None
          for line in sys.stdin:
              try:
                  message = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if message.get("reason") == "compiler-message":
                  rendered = message.get("message", {}).get("rendered")
                  if rendered:
                      print(rendered, file=sys.stderr, end="")
              target = message.get("target", {})
              if target.get("name") == "walker" and message.get("executable"):
                  executable = message["executable"]
          if executable is None:
              raise SystemExit("cargo did not report the walker benchmark executable")
          shutil.copy2(executable, sys.argv[1])
          ' "$destination"
            chmod +x "$destination"
          }

          build_benchmark \
            "$RUNNER_TEMP/ferralk-bench-base" \
            "$RUNNER_TEMP/walker-merge-base" \
            "$GITHUB_WORKSPACE/target/walker-${{ matrix.lane }}-merge-base"
          build_benchmark \
            "$RUNNER_TEMP/ferralk-bench-head" \
            "$RUNNER_TEMP/walker-head" \
            "$GITHUB_WORKSPACE/target/walker-${{ matrix.lane }}-head"
      - name: Measure merge base and pull-request head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RUNNER_TEMP/ferralk-bench-base"
            CARGO_TARGET_DIR="$RUNNER_TEMP/criterion-merge-base" \
              "$RUNNER_TEMP/walker-merge-base" \
                --bench --warm-up-time 1 --measurement-time 5 --sample-size 20 \
                --output-format bencher
          ) | tee "walker-${{ matrix.lane }}-merge-base.txt"
          (
            cd "$RUNNER_TEMP/ferralk-bench-head"
            CARGO_TARGET_DIR="$RUNNER_TEMP/criterion-head" \
              "$RUNNER_TEMP/walker-head" \
                --bench --warm-up-time 1 --measurement-time 5 --sample-size 20 \
                --output-format bencher
          ) | tee "walker-${{ matrix.lane }}-head.txt"
      # Shorter than criterion's defaults so the lane stays inside a pull
      # request's budget; the sample count is still large enough for a median.
      # The restored target directory can carry partial criterion state from
      # another commit, and criterion then fails to load a baseline and prints
      # no measurement at all -- while still exiting zero. Start from nothing.
      - name: Measure
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          rm -rf target/criterion
          cargo bench -p bench --bench walker ${{ matrix.features }} -- \
            --warm-up-time 1 --measurement-time 5 --sample-size 20 \
            --output-format bencher | tee walker-${{ matrix.lane }}.txt
      # A performance lane that prints nothing must not report success.
      - name: Check that the lane actually measured something
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if ! grep -q 'ns/iter' walker-${{ matrix.lane }}.txt; then
            echo "::error::the walker benchmark produced no measurements"
            exit 1
          fi
      - name: Publish the medians
        if: github.event_name != 'pull_request' && always()
        run: |
          {
            echo "### Walker wall time — ${{ matrix.lane }}"
            echo
            echo '| Benchmark | ns/iter | +/- |'
            echo '| --- | ---: | ---: |'
            sed -n 's/^test \(.*\) \.\.\. bench: *\([0-9,]*\) ns\/iter (+\/- \([0-9,]*\))$/| `\1` | \2 | \3 |/p' \
              walker-${{ matrix.lane }}.txt
            echo
            echo 'Shared runner, warm page cache. Indicative, not a regression gate.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the pull-request comparison
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Walker wall time — ${{ matrix.lane }}"
            echo
            echo 'Merge base `${{ steps.revisions.outputs.merge_base }}`; PR head `${{ steps.revisions.outputs.head }}`.'
            echo
            cargo run --quiet --locked -p bench --bin compare_bencher -- \
              "walker-${{ matrix.lane }}-merge-base.txt" \
              "walker-${{ matrix.lane }}-head.txt"
            echo
            echo 'Shared runner, warm page cache. Head/base is indicative, not a regression gate.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the raw measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: walker-walltime-${{ matrix.lane }}
          path: walker-${{ matrix.lane }}*.txt
          if-no-files-found: warn

  # Windows visibility. The wall-time job above compares merge base and head
  # for every shipped backend, and Windows ships only the portable one -- but
  # it was still the one platform whose walker had no published number at all.
  #
  # Snapshot only, on push and dispatch. A per-pull-request comparison would
  # build the fixture set twice on the slowest filesystem in the matrix, which
  # is a large budget for a tier-2 target; issue #358 asks for visibility here
  # rather than a gate. If the fixture set stops being practical on this
  # runner, this job is the one to drop.
  windows:
    name: walker walltime (portable, Windows)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Measure
        shell: bash
        run: |
          rm -rf target/criterion
          cargo bench -p bench --bench walker -- \
            --warm-up-time 1 --measurement-time 5 --sample-size 20 \
            --output-format bencher | tee walker-windows.txt
      - name: Check that the lane actually measured something
        shell: bash
        run: |
          if ! grep -q 'ns/iter' walker-windows.txt; then
            echo "::error::the Windows walker benchmark produced no measurements"
            exit 1
          fi
      - name: Publish the medians
        if: always()
        shell: bash
        run: |
          {
            echo "### Walker wall time — portable, Windows"
            echo
            echo '| Benchmark | ns/iter | +/- |'
            echo '| --- | ---: | ---: |'
            sed -n 's/^test \(.*\) \.\.\. bench: *\([0-9,]*\) ns\/iter (+\/- \([0-9,]*\))$/| `\1` | \2 | \3 |/p' \
              walker-windows.txt
            echo
            echo 'Shared runner, warm page cache. The deep-chain arm uses a shorter chain here than on Unix; see walker.rs.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the raw measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: walker-walltime-windows
          path: walker-windows.txt
          if-no-files-found: warn

  # The user-space CPU lane. Wall time on a shared runner cannot see a walk
  # that executes far more instructions while filesystem and kernel time hide
  # it -- on macOS 95% of a warm walk's samples are in three syscalls, so the
  # walker's own work could triple without moving the median. Callgrind counts
  # instructions instead, which is deterministic enough to compare two commits
  # on one runner.
  #
  # Non-gating on purpose. Per issue #358 the harness lands first so that the
  # merge base already contains it, repeatability is observed across real pull
  # requests, and only then does a threshold -- provisionally 5% -- start
  # failing the job. Reading this lane as a speed measurement would be wrong in
  # both directions: Callgrind serializes threads and does not model syscall
  # latency, so the parallel arm reports work performed, never time taken.
  cpu:
    name: user-space CPU (portable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y valgrind
      - name: Prepare pull-request revisions
        if: github.event_name == 'pull_request'
        id: revisions
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git worktree add --detach "$RUNNER_TEMP/ferralk-cpu-base" "$merge_base"
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # Both revisions walk one tree built once, natively. Building 53,601
      # files inside the measured region would bury the walk, and building it
      # under Valgrind would cost minutes for work no one is measuring.
      - name: Build the harnesses and the fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p bench --bin cpu_walk
          cp target/release/cpu_walk "$RUNNER_TEMP/cpu_walk-head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CARGO_TARGET_DIR="$RUNNER_TEMP/cpu-base-target" \
              cargo build --release --locked \
                --manifest-path "$RUNNER_TEMP/ferralk-cpu-base/Cargo.toml" \
                -p bench --bin cpu_walk
            cp "$RUNNER_TEMP/cpu-base-target/release/cpu_walk" "$RUNNER_TEMP/cpu_walk-merge-base"
          fi
          fixture=$("$RUNNER_TEMP/cpu_walk-head" prepare)
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
      - name: Count instructions
        shell: bash
        run: |
          set -euo pipefail
          measure() {
            local binary=$1 label=$2 threads=$3
            valgrind --tool=callgrind --callgrind-out-file="callgrind-$label.out" \
              "$binary" walk "$FIXTURE" "$threads" >/dev/null 2>"callgrind-$label.log"
          }
          measure "$RUNNER_TEMP/cpu_walk-head" head-serial 1
          measure "$RUNNER_TEMP/cpu_walk-head" head-parallel 4
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            measure "$RUNNER_TEMP/cpu_walk-merge-base" base-serial 1
            measure "$RUNNER_TEMP/cpu_walk-merge-base" base-parallel 4
          fi
      - name: Publish the instruction counts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import os
          import pathlib
          import re


          def instructions(label):
              """Total Ir from a Callgrind output file, or None when absent."""
              path = pathlib.Path(f"callgrind-{label}.out")
              if not path.is_file():
                  return None
              for line in path.read_text(encoding="utf-8", errors="replace").splitlines():
                  match = re.match(r"^(?:summary|totals):\s+(\d+)", line)
                  if match:
                      return int(match.group(1))
              return None


          arms = [("serial", "1 thread"), ("parallel", "4 threads")]
          is_pull_request = os.environ.get("GITHUB_EVENT_NAME") == "pull_request"
          print("### User-space CPU — portable")
          print()
          if is_pull_request:
              print("| Arm | Merge base | Head | Head/base |")
              print("| --- | ---: | ---: | ---: |")
          else:
              print("| Arm | Instructions |")
              print("| --- | ---: |")
          missing = []
          for arm, label in arms:
              head = instructions(f"head-{arm}")
              if head is None:
                  missing.append(arm)
              if is_pull_request:
                  base = instructions(f"base-{arm}")
                  if base is None:
                      missing.append(f"base-{arm}")
                  ratio = f"{head / base:.3f}x" if head and base else "n/a"
                  print(
                      f"| {label} | {base:,} | {head:,} | {ratio} |"
                      if head and base
                      else f"| {label} | n/a | n/a | n/a |"
                  )
              else:
                  print(f"| {label} | {head:,} |" if head else f"| {label} | n/a |")
          print()
          print(
              "Instruction counts, not time. Callgrind serializes threads and does "
              "not model syscall latency, so the four-thread row reports work "
              "performed rather than elapsed time. Non-gating while repeatability "
              "is observed; see issue #358."
          )
          if missing:
              print()
              print(f"Callgrind produced no total for: {', '.join(missing)}.")
              raise SystemExit("::error::the CPU lane produced no instruction count")
          PYTHON
      - name: Upload the raw measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: walker-cpu-portable
          path: |
            callgrind-*.out
            callgrind-*.log
          if-no-files-found: warn

  # The engine comparison from docs/benchmark-evidence.md. It builds a 53k-file
  # tree and runs every arm over it, which is too much work for every pull
  # request and answers a question that does not change per commit, so it runs
  # on request. Rust-only: the zlob arm needs Zig and stays a local or
  # manual-dispatch concern, see zlob-benchmark.yml.
  #
  # This lane measures the portable backend. The native backends are compared
  # against it locally, on the platform that has them; see the reproduction
  # commands in docs/benchmark-evidence.md.
  comparison:
    name: engine comparison (portable)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Measure
        shell: bash
        run: >-
          cargo bench -p bench --bench walker_palamedes --
          --output-format bencher | tee walker-palamedes.txt
      - name: Publish the medians
        if: always()
        run: |
          {
            echo "### Engine comparison — repository shape"
            echo
            echo '| Benchmark | ns/iter | +/- |'
            echo '| --- | ---: | ---: |'
            sed -n 's/^test \(.*\) \.\.\. bench: *\([0-9,]*\) ns\/iter (+\/- \([0-9,]*\))$/| `\1` | \2 | \3 |/p' \
              walker-palamedes.txt
            echo
            echo 'Shared runner, warm page cache. Indicative, not a regression gate.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the raw measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: walker-palamedes
          path: walker-palamedes.txt
          if-no-files-found: warn
