name: Glob fuzz

# Automatic coverage for the matcher's own fuzz targets, and for the gitignore
# rule layer that compiles onto it (ADR-0014): a short budget on
# every pull request and a long one overnight. `fuzz.yml` stays the manual
# entry point for running a single target with a custom budget.

on:
  pull_request:
    branches: [main]
  schedule:
    # Long nightly run, off the pull-request budget.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Maximum fuzz duration in seconds, per target
        required: true
        default: "900"

permissions:
  contents: read

env:
  # Pull requests stay bounded; the nightly run carries the long budget.
  MAX_TOTAL_TIME: ${{ inputs.max_total_time || (github.event_name == 'schedule' && '900' || '60') }}

jobs:
  fuzz:
    name: glob fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [pattern_parser, pattern_matcher, ferralk_vs_fast_glob, ignore_rule_parser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: nightly-2026-08-04
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-fuzz
      # cargo-fuzz defaults to the target it was itself built for, and the
      # prebuilt binary is musl, where the sanitizer cannot link against a
      # static libc. Name this runner's host target instead.
      # Large but bounded compile attempts are expected corpus inputs. ASAN's
      # quarantine can retain several of those temporary allocations, so keep
      # the RSS limit above that retained peak while bounding any one input's
      # live allocation budget.
      - name: Run ${{ matrix.target }}
        env:
          FERRALK_FUZZ_SUBSET_STATS: ${{ runner.temp }}/ferralk-fast-glob-subset.txt
          # The matcher target has direct seed replay for its long-candidate
          # case; automated mutation should spend its budget on syntax shape.
          MAX_LEN: ${{ matrix.target == 'pattern_matcher' && '128' || '0' }}
        run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }}
          -- -max_total_time=$MAX_TOTAL_TIME -rss_limit_mb=4096 -malloc_limit_mb=256
          -max_len=$MAX_LEN -print_final_stats=1
      - name: Report differential subset hit rate
        if: always() && matrix.target == 'ferralk_vs_fast_glob'
        run: |
          stats="$RUNNER_TEMP/ferralk-fast-glob-subset.txt"
          if [[ -f "$stats" ]]; then
            cat "$stats"
          else
            echo 'No differential subset checkpoint was produced.'
          fi
      # A failing run writes its input under fuzz/artifacts; without this
      # upload the reproducer only exists in the log (PR #43 taught us that).
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glob-fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  report-nightly-failure:
    name: report scheduled failure
    needs: fuzz
    if: always() && github.event_name == 'schedule' && needs.fuzz.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or refresh the nightly glob-fuzz issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const marker = '<!-- ferralk-nightly-glob-fuzz -->';
            const runMarker = `<!-- run:${context.runId} -->`;
            const title = 'Nightly glob fuzz failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const latest = `${runMarker}\n- Run: ${runUrl}\n- Commit: \`${context.sha}\``;
            const body = `${marker}\nAutomated tracker for failed scheduled glob-fuzz runs. Keep this issue open until the latest failure is triaged.\n\nLatest failure:\n${latest}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'all',
              labels: 'area: glob,type: testing',
              per_page: 100,
            });
            const tracking = issues.find(issue =>
              !issue.pull_request && issue.body?.includes(marker)
            );

            if (!tracking) {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ['area: glob', 'type: testing'],
              });
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: tracking.number,
              per_page: 100,
            });
            const alreadyRecorded = tracking.body?.includes(runMarker) ||
              comments.some(comment => comment.body?.includes(runMarker));
            await github.rest.issues.update({
              ...context.repo,
              issue_number: tracking.number,
              state: 'open',
              body,
            });
            if (!alreadyRecorded) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: tracking.number,
                body: `Another scheduled glob-fuzz run failed.\n\n${latest}`,
              });
            }
