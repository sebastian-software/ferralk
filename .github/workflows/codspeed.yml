name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust and cargo-codspeed
        uses: moonrepo/setup-rust@v0
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed
      # Matcher benches only. The walker benches do real filesystem work on
      # several threads, which the simulation instrument serializes and cannot
      # model; they run in the wall-time lane in walker-bench.yml.
      - name: Build benchmarks
        run: cargo codspeed build -p bench --bench matcher
      - uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run -p bench --bench matcher
