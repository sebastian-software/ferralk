name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo bench -p bench
