name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Surface new RustSec advisories in quiet phases. Only the audit job runs
    # on this trigger; every other job is guarded below.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: format and lints
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The oracle adapter links the pinned zlob build, so linting the whole
      # workspace needs the same Zig toolchain the coverage job installs.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The fuzz crate is a separate workspace, so `--workspace` never sees
      # it; a corpus::Case schema change once broke its hand-built struct
      # literal invisibly. Check the three platform-neutral glob bins here —
      # the native dirent bins are cfg-gated per OS (no single host compiles
      # them all) and every PR already builds them in the native fuzz jobs.
      - run: >-
          cargo check --manifest-path fuzz/Cargo.toml
          --bin pattern_parser --bin pattern_matcher --bin ferralk_vs_fast_glob

  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test -p corpus -p harness -p bench
      - run: cargo run -p harness -- corpus

  macos-native:
    name: macOS native backend
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ferralk --features native-macos
      - run: cargo check --manifest-path fuzz/Cargo.toml --bin macos_dirent_parser --locked

  linux-native:
    name: Linux native backend
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ferralk --features native-linux
      - run: cargo check --manifest-path fuzz/Cargo.toml --bin linux_dirent_parser --locked

  msrv:
    name: msrv (workspace rust-version)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ADR-0004 keeps the MSRV at current stable minus two releases. The
      # workspace manifest is the single place it is written down.
      - name: Read the MSRV from the workspace manifest
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Workspace MSRV is $version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Benches and tests are checked too, so a bench-only MSRV regression
      # cannot hide. The oracle adapter is excluded: it builds zlob from Zig
      # sources, is never published, and the oracle workflow covers it.
      - run: cargo check --workspace --exclude oracle --all-targets --locked
      - name: Check the native backend features that build on this runner
        run: >-
          cargo check -p ferralk -p bench
          --features ferralk/native-linux,bench/native-linux
          --all-targets --locked

  semver:
    name: public API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check published crate APIs against the PR base
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: ferralk-glob,ferralk
          baseline-rev: ${{ github.event.pull_request.base.sha }}

  security-audit:
    name: dependency and unsafe audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
      - name: Forbid unsafe Rust outside native backend modules
        run: |
          if rg -n '\bunsafe\b' --glob '*.rs' --glob '!target/**' --glob '!crates/ferralk/src/macos_native.rs' --glob '!crates/ferralk/src/linux_native.rs' .; then
            echo 'unsafe Rust is permitted only in an audited native backend module.'
            exit 1
          fi

  coverage:
    name: coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
