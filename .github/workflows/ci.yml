name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo test -p corpus -p harness -p bench
      - run: cargo run -p harness -- corpus

  macos-native:
    name: macOS native backend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ferralk --features native-macos
      - run: cargo check --manifest-path fuzz/Cargo.toml --bin macos_dirent_parser --locked

  linux-native:
    name: Linux native backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ferralk --features native-linux
      - run: cargo check --manifest-path fuzz/Cargo.toml --bin linux_dirent_parser --locked

  msrv:
    name: msrv (1.93)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      - run: cargo check
      - run: cargo check -p corpus -p harness -p bench

  semver:
    name: public API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check published crate APIs against the PR base
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: ferralk-glob,ferralk
          baseline-rev: ${{ github.event.pull_request.base.sha }}

  security-audit:
    name: dependency and unsafe audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - name: Forbid unsafe Rust outside native backend modules
        run: |
          if rg -n '\bunsafe\b' --glob '*.rs' --glob '!target/**' --glob '!crates/ferralk/src/macos_native.rs' --glob '!crates/ferralk/src/linux_native.rs' .; then
            echo 'unsafe Rust is permitted only in an audited native backend module.'
            exit 1
          fi

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
