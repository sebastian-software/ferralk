name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Surface RustSec advisories and Rust stable-release drift in quiet phases.
    # Only security-audit and msrv-policy run on this trigger.
    - cron: "0 6 * * 1"
  # Runs only the MSRV policy check, without the ordinary CI matrix.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GIT_ORACLE_VERSION: 2.52.0
  GIT_ORACLE_SHA256: 3cd8fee86f69a949cb610fee8cd9264e6873d07fa58411f6060b3d62729ed7c5

jobs:
  pr-title:
    name: PR title and commits follow Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate every possible release-note subject
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|perf|deps|chore|docs|refactor|test|build|ci)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+'

          validate_subject() {
            local source=$1
            local subject=$2
            if [[ "$subject" =~ $pattern ]]; then
              return 0
            fi
            printf '%s must use <type>[(scope)][!]: <summary>: %s\n' "$source" "$subject" >&2
            return 1
          }

          failures=0
          if ! validate_subject 'PR title' "$PR_TITLE"; then
            failures=1
          fi

          if ! commit_lines=$(git log --no-merges --format='%H%x09%s' "$BASE_SHA..$HEAD_SHA"); then
            echo "Could not enumerate pull-request commits: $BASE_SHA..$HEAD_SHA" >&2
            exit 1
          fi
          if [[ -z "$commit_lines" ]]; then
            echo 'The pull-request head has no commits outside its base.' >&2
            exit 1
          fi

          while IFS=$'\t' read -r sha subject; do
            if ! validate_subject "Commit ${sha:0:12}" "$subject"; then
              failures=1
            fi
          done <<< "$commit_lines"

          if ((failures != 0)); then
            echo 'Allowed types: feat, fix, perf, deps, chore, docs, refactor, test, build, ci.' >&2
            exit 1
          fi

  lint:
    name: format and lints
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-public-api@0.52.0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude oracle --all-targets --locked -- -D warnings
      - name: Install nightly rustdoc toolchain
        run: rustup toolchain install nightly --profile minimal --no-self-update
      - name: Check the reviewed public API snapshots
        shell: bash
        run: |
          cargo public-api -p ferralk --simplified --color never > "$RUNNER_TEMP/ferralk.txt"
          cargo public-api -p ferralk-glob --simplified --color never > "$RUNNER_TEMP/ferralk-glob.txt"
          diff --unified docs/api/ferralk.txt "$RUNNER_TEMP/ferralk.txt"
          diff --unified docs/api/ferralk-glob.txt "$RUNNER_TEMP/ferralk-glob.txt"
      # The fuzz crate is a separate workspace, so `--workspace` never sees
      # it; a corpus::Case schema change once broke its hand-built struct
      # literal invisibly. Check the three platform-neutral glob bins here —
      # the native dirent bins are cfg-gated per OS (no single host compiles
      # them all) and every PR already builds them in the native fuzz jobs.
      - run: >-
          cargo check --manifest-path fuzz/Cargo.toml
          --bin pattern_parser --bin pattern_matcher --bin ferralk_vs_fast_glob
          --locked
      # The differential support library owns the executable subset and seed
      # invariants; keep every checked-in seed on the real comparison path.
      - run: cargo test --manifest-path fuzz/Cargo.toml --lib --locked

  test:
    name: test (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --exclude oracle --locked
      - run: cargo run -p harness -- corpus

  git-oracle:
    name: Git 2.52.0 ignore oracle
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the pinned Git oracle
        shell: bash
        run: |
          archive="$RUNNER_TEMP/git-$GIT_ORACLE_VERSION.tar.xz"
          source="$RUNNER_TEMP/git-$GIT_ORACLE_VERSION-source"
          prefix="$RUNNER_TEMP/git-$GIT_ORACLE_VERSION-prefix"
          curl --fail --location --silent --show-error \
            "https://www.kernel.org/pub/software/scm/git/git-$GIT_ORACLE_VERSION.tar.xz" \
            --output "$archive"
          echo "$GIT_ORACLE_SHA256  $archive" | sha256sum --check -
          mkdir --parents "$source"
          tar --extract --file "$archive" --directory "$source" --strip-components=1
          make --directory "$source" --jobs=2 prefix="$prefix" \
            NO_CURL=YesPlease NO_EXPAT=YesPlease NO_GETTEXT=YesPlease \
            NO_OPENSSL=YesPlease NO_PERL=YesPlease NO_PYTHON=YesPlease \
            NO_TCLTK=YesPlease install
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Replay the ignore corpus with the pinned Git oracle
        shell: bash
        env:
          # Turn a version skip into a failure: this job exists to replay.
          FERRALK_REQUIRE_GIT_ORACLE: "1"
        run: |
          test "$(git --version)" = "git version $GIT_ORACLE_VERSION"
          cargo test -p harness --test git_check_ignore --locked -- --show-output

  git-oracle-windows:
    name: Git ignore and root-spelling oracle (Windows)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Replay ignore corpus and root spellings with Git for Windows
        shell: pwsh
        env:
          FERRALK_REQUIRE_GIT_ORACLE: "1"
        run: |
          git --version
          cargo test -p harness --test git_check_ignore --locked -- --show-output

  macos-native:
    name: macOS native backend
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p ferralk --features native-macos
      - run: >-
          cargo check --manifest-path fuzz/Cargo.toml
          --bin macos_dirent_parser --bin macos_bulk_record_parser --locked

  linux-native:
    name: ${{ matrix.name }}
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the existing check name for branch-protection compatibility.
          - name: Linux native backend
            os: ubuntu-latest
          - name: Linux native backend (aarch64)
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p ferralk --features native-linux
      - run: cargo check --manifest-path fuzz/Cargo.toml --bin linux_dirent_parser --locked

  msrv:
    name: msrv (workspace rust-version)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ADR-0004 keeps the MSRV at current stable minus two releases. The
      # fuzz crate is a separate workspace, but shares this same floor.
      - name: Read and align the declared MSRVs
        id: msrv
        run: |
          workspace_version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          fuzz_version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' fuzz/Cargo.toml)
          test -n "$workspace_version"
          test "$fuzz_version" = "$workspace_version"
          echo "version=$workspace_version" >> "$GITHUB_OUTPUT"
          echo "Workspace and fuzz MSRV is $workspace_version"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Benches and tests are checked too, so a bench-only MSRV regression
      # cannot hide. The oracle adapter is excluded: it builds zlob from Zig
      # sources, is never published, and the oracle workflow covers it.
      - run: cargo check --workspace --exclude oracle --all-targets --locked
      - name: Check the native backend features that build on this runner
        run: >-
          cargo check -p ferralk -p bench
          --features ferralk/native-linux,bench/native-linux
          --all-targets --locked
      - name: Check the platform-neutral fuzz targets
        run: >-
          cargo check --manifest-path fuzz/Cargo.toml
          --bin pattern_parser --bin pattern_matcher --bin ignore_rule_parser
          --bin ferralk_vs_fast_glob
          --locked

  msrv-policy:
    name: MSRV stable-minus-two policy
    # Fetching release metadata is intentionally kept off ordinary pull
    # requests: a network outage must not make deterministic CI flaky.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the manifest against Rust stable
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-delay 5 --silent --show-error \
            https://static.rust-lang.org/dist/channel-rust-stable.toml \
            --output channel-rust-stable.toml

          stable=$(awk '
            $0 == "[pkg.rust]" { in_rust = 1; next }
            /^\[/ { in_rust = 0 }
            in_rust && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' channel-rust-stable.toml)
          test -n "$stable"

          IFS=. read -r major minor patch <<EOF
          $stable
          EOF
          test "$major" = 1
          test "$minor" -ge 2
          expected="$major.$((minor - 2))"
          declared=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$declared"

          echo "Rust stable is $stable; policy expects MSRV $expected."
          test "$declared" = "$expected"

  semver:
    name: public API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect the checked-in contract baseline
        id: contract-baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if git cat-file -e "$BASE_SHA:docs/api/ferralk.txt" && \
             git cat-file -e "$BASE_SHA:docs/api/ferralk-glob.txt"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      # The PR that first checks in the reviewed 1.0 API snapshots is the
      # one-time pre-1.0 breaking baseline reset. Once those files exist on
      # main, every later PR takes the ordinary compatibility path below.
      - name: Establish the reviewed pre-1.0 API baseline
        if: steps.contract-baseline.outputs.exists == 'false'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: ferralk-glob,ferralk
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          feature-group: default-features
          release-type: major
      - name: Check published crate APIs against the PR base
        if: steps.contract-baseline.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: ferralk-glob,ferralk
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          feature-group: default-features

  security-audit:
    name: dependency and unsafe audit
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: taiki-e/install-action@cf5ac2b54c26f20d01aff42a5b8de2e58f229ce3 # cargo-audit branch
      - run: cargo audit
      - name: Forbid unsafe Rust outside native backend modules
        run: |
          if rg -n '\bunsafe\b' --glob '*.rs' --glob '!target/**' --glob '!crates/ferralk/src/macos_native.rs' --glob '!crates/ferralk/src/linux_native.rs' .; then
            echo 'unsafe Rust is permitted only in an audited native backend module.'
            exit 1
          fi

  coverage:
    name: coverage
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@fb8f18cbbad93e39d8b8d65145468a6b2c09877f # cargo-llvm-cov branch
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
